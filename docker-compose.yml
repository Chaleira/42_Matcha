version: '3.8'

services:
  db:
    container_name: database
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - default
  backend:
    container_name: backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    networks:
      - default

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      args:
        VITE_PRODUCTION: ${VITE_PRODUCTION}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
    ports:
      - "8080:8080"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    env_file: .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - db

volumes:
  pg-data:
  pgadmin-data:

networks: 
  default:
